<script>

function soloMayus(event) {
  // Obtiene el código de la tecla presionada
  var codigoTecla = event.keyCode ? event.keyCode : event.which;

  // Verifica si el código de la tecla es un número
  if (codigoTecla < 65 || codigoTecla > 90) 
  if (codigoTecla < 97 || codigoTecla > 122) {
    // Si la tecla presionada no es un número, no permite la entrada
    event.preventDefault();
  }
}
  
</script>
